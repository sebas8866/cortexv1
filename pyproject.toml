[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cortex-agents"
version = "0.1.0"
description = "A persistent-memory operating system for long-running autonomous agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Cortex maintainers" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
redis = ["redis>=5.0"]
dashboard = ["streamlit>=1.35", "pandas>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
cortex = "cortex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
